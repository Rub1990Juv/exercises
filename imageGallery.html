<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Gallery</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f5f9;
    padding:40px;
}

h1{
    text-align:center;
    margin-bottom:30px;
    color:#333;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.gallery img{
    width:100%;
    height:250px;
    object-fit:cover;
    border-radius:15px;
    cursor:pointer;
    transition:.4s;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.gallery img:hover{
    transform:scale(1.06);
    box-shadow:0 20px 40px rgba(0,0,0,.3);
}

.lightbox{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    display:none;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.lightbox img{
    max-width:90%;
    max-height:90%;
    border-radius:10px;
}

.lightbox.active{
    display:flex;
}

</style>

</head>
<body>

<h1>Image Gallery</h1>

<div class="gallery">

<img src="https://picsum.photos/id/1015/600/400" alt="">
<img src="https://picsum.photos/id/1016/600/400" alt="">
<img src="https://picsum.photos/id/1018/600/400" alt="">
<img src="https://picsum.photos/id/1020/600/400" alt="">
<img src="https://picsum.photos/id/1024/600/400" alt="">
<img src="https://picsum.photos/id/1025/600/400" alt="">
<img src="https://picsum.photos/id/1035/600/400" alt="">
<img src="https://picsum.photos/id/1043/600/400" alt="">
<img src="https://picsum.photos/id/1050/600/400" alt="">
<img src="https://picsum.photos/id/1069/600/400" alt="">
<img src="https://picsum.photos/id/1074/600/400" alt="">
<img src="https://picsum.photos/id/1084/600/400" alt="">

</div>

<div class="lightbox" id="lightbox">
    <img id="bigImage" src="">
</div>

<script>

const images=document.querySelectorAll(".gallery img");
const lightbox=document.getElementById("lightbox");
const bigImage=document.getElementById("bigImage");

images.forEach(img=>{

    img.onclick=()=>{

        lightbox.classList.add("active");
        bigImage.src=img.src;

    };

});

lightbox.onclick=()=>{

    lightbox.classList.remove("active");

};

</script>

</body>
</html>
