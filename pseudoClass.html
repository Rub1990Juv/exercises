<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Card</title>

<style>
body{
    margin:0;
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:sans-serif;
}

/* Հիմնական քարտը */
.interactive-card{
    background:#1e293b;
    padding:30px;
    border-radius:16px;
    color:white;
    width:300px;
    border:2px solid transparent;
    transition:all .4s ease;
}

/* 1. :hover */
.interactive-card:hover{
    transform:translateY(-10px);
    box-shadow:0 20px 40px rgba(99,102,241,.2);
    border-color:#6366f1;
}

/* Input-ի խումբը */
.input-group{
    position:relative;
    margin:25px 0;
}

.input-group input{
    width:100%;
    padding:12px;
    background:#334155;
    border:2px solid transparent;
    border-radius:8px;
    color:white;
    outline:none;
    box-sizing:border-box;
    transition:all .3s ease;
}

/* 2. :focus */
.input-group input:focus{
    border-color:#38bdf8;
    background:#1e293b;
}

/* 3. :focus-within */
.interactive-card:focus-within{
    background:#0f172a;
    box-shadow:0 0 30px rgba(56,189,248,.4);
    border-color:#38bdf8;
}

/* Label */
.input-group label{
    position:absolute;
    left:12px;
    top:12px;
    color:#94a3b8;
    pointer-events:none;
    transition:all .3s ease;
}

/* 4. :focus + :not(:placeholder-shown) */
.input-group input:focus ~ label,
.input-group input:not(:placeholder-shown) ~ label{
    top:-20px;
    left:5px;
    font-size:12px;
    color:#38bdf8;
}

/* Button */
.btn{
    width:100%;
    padding:12px;
    background:#6366f1;
    color:white;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    transition:background .2s, transform .2s;
}

/* 5. :active */
.btn:active{
    transform:scale(.98);
    background:#4f46e5;
}
</style>
</head>

<body>

<div class="interactive-card">

    <h3>Interactive Box</h3>

    <p>Անցիր մկնիկով կամ սեղմիր դաշտի վրա</p>

    <div class="input-group">
        <input type="text" id="username" placeholder=" ">
        <label for="username">Գրիր որևէ բան...</label>
    </div>

    <button class="btn">Հաստատել</button>

</div>

</body>
</html>
