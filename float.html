<!DOCTYPE html>
<html>
<head>
<style>
div {
  float: left;
  padding: 20px; 
  animation-name:move;
  animation-delay: 1s;
  animation-duration: 5s;
  
}

.div1 {
  background: red;
}

.div2 {
  background: yellow;
}

.div3 {
  background: green;
}

@keyframes move{
    0{
        margin-left:0%;
    }
    50%{
        margin-right:100%;
    }
    100%{
        margin-left:0%;
    }
}

</style>
</head>
<body>

<h2>Float Next To Each Other</h2>

<p>In this example, the three divs will float next to each other.</p>

<div class="div1">Div 1</div>
<div class="div2">Div 2</div>
<div class="div3">Div 3</div>

</body>
</html>
