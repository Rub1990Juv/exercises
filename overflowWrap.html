<!DOCTYPE html>
<html>
<head>
<style>
.container {
  display: flex;
  width: 300px;
  overflow-wrap: anywhere;

}

.item {
  border: 1px solid black;
  padding: 10px;
  
}

.containerBlock {
  display: flex;
  width: 300px;
  overflow-wrap: break-word;

}

</style>
</head>
<body>

<div class="container">
  <div class="item">
    VeryVeryVeryVeryLongWordWithoutSpaces123456789
  </div>

  <div class="item">
    Text
  </div>
</div>


<div class="containerBlock">
  <div class="item">
    VeryVeryVeryVeryLongWordWithoutSpaces123456789
  </div>

  <div class="item">
    Text
  </div>
</div>
</body>
</html>
