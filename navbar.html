<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Navigation</title>
    <link rel="stylesheet" href="style.css">
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}

nav{
    width:90%;
    max-width:1100px;
    margin:30px auto;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:18px 35px;

    background:rgba(255,255,255,.08);
    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,.2);
    border-radius:50px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.3),
        inset 0 0 10px rgba(255,255,255,.1);
}

.logo{
    color:white;
    font-size:28px;
    font-weight:bold;
    letter-spacing:3px;
}

ul{
    display:flex;
    list-style:none;
    gap:35px;
}

a{
    color:white;
    text-decoration:none;
    font-size:18px;
    position:relative;
    padding:8px 0;
    transition:.3s;
}

a::before{
    content:"";
    position:absolute;
    left:50%;
    bottom:-6px;

    width:0;
    height:3px;

    background:#00eaff;
    border-radius:10px;

    transition:.4s;
    transform:translateX(-50%);
}

a:hover{
    color:#00eaff;
}

a:hover::before{
    width:100%;
}
</style>
</head>
<body>

<nav>
  

    <ul>
        <li><a href="#">Գլխավոր</a></li>
        <li><a href="#">Մեր մասին</a></li>
        <li><a href="#">Ծառայություններ</a></li>
        <li><a href="#">Բլոգ</a></li>
        <li><a href="#">Կապ</a></li>
    </ul>
</nav>

</body>
</html>
