<!DOCTYPE html>
<html>
<head>
<style>

*{
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
}


/* Form box */

.form-box{
    width:350px;
    padding:35px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(12px);
    border-radius:20px;
    box-shadow:0 20px 40px rgba(0,0,0,.2);
}


.form-box h2{
    text-align:center;
    color:white;
    margin-bottom:30px;
}


/* Input group */

.input-box{
    position:relative;
    margin-bottom:25px;
}


.input-box input,
.input-box textarea{

    width:100%;
    padding:12px;
    border:none;
    outline:none;

    background:transparent;
    border-bottom:2px solid rgba(255,255,255,.5);

    color:white;
    font-size:16px;
}


.input-box textarea{
    resize:none;
    height:80px;
}


/* Label */

.input-box label{

    position:absolute;
    left:0;
    top:12px;

    color:#ddd;
    pointer-events:none;

    transition:.3s;
}


/* Floating effect */

.input-box input:focus ~ label,
.input-box input:not(:placeholder-shown) ~ label,
.input-box textarea:focus ~ label,
.input-box textarea:not(:placeholder-shown) ~ label{

    top:-12px;
    font-size:12px;
    color:#fff;
}


/* Animated line */

.input-box::after{

    content:"";

    position:absolute;
    left:0;
    bottom:0;

    width:0;
    height:2px;

    background:white;

    transition:.4s;
}


.input-box:focus-within::after{
    width:100%;
}


/* Button */

button{

    width:100%;
    padding:13px;

    border:none;
    border-radius:30px;

    background:white;
    color:#764ba2;

    font-size:16px;
    cursor:pointer;

    transition:.3s;
}


button:hover{

    transform:translateY(-3px);
    box-shadow:0 10px 20px rgba(0,0,0,.3);
}


</style>
</head>


<body>


<form class="form-box">

<h2>Contact Form</h2>


<div class="input-box">
<input type="text" placeholder=" " required>
<label>Անուն</label>
</div>


<div class="input-box">
<input type="email" placeholder=" " required>
<label>Email</label>
</div>


<div class="input-box">
<textarea placeholder=" "></textarea>
<label>Հաղորդագրություն</label>
</div>


<button>
Ուղարկել
</button>


</form>


</body>
</html>
